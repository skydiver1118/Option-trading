name: SOXL Daily WR CCI Ablation
on:
  push:
    paths:
      - 'scripts/soxl_daily_wr_cci_ablation.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run ablation
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/soxl_daily_wr_cci_ablation.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/williams_r/soxl_daily_wr_cci_ablation.csv
          git commit -m 'Update SOXL WR CCI ablation results' || exit 0
          git push
