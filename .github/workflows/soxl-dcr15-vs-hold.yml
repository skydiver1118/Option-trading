name: SOXL DCR15 vs Hold
on:
  workflow_dispatch:
  push:
    paths: ['scripts/soxl_dcr15_vs_hold.py']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run comparison
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/soxl_dcr15_vs_hold.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/williams_r/soxl_dcr15_vs_hold.csv
          git commit -m 'Update DCR15 vs hold results' || exit 0
          git push
