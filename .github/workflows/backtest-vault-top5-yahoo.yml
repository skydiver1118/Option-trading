name: Backtest Herman Vault Top 5 Yahoo
on:
  push:
    paths:
      - 'scripts/backtest_vault_top5_yahoo_20260912.py'
      - 'scripts/vault_top5_benchmark_yahoo_20260912.py'
      - '.github/workflows/backtest-vault-top5-yahoo.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy yfinance
      - run: python scripts/backtest_vault_top5_yahoo_20260912.py
      - run: python scripts/vault_top5_benchmark_yahoo_20260912.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/herman_vault_top5_yahoo_20260912
          git diff --cached --quiet || git commit -m 'Add Herman vault top 5 Yahoo backtest results'
          git push
