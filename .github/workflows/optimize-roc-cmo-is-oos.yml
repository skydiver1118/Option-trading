name: Optimize ROC CMO IS OOS
on:
  workflow_dispatch:
  push:
    paths: ['scripts/optimize_roc_cmo_is_oos.py','.github/workflows/optimize-roc-cmo-is-oos.yml']
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy
      - name: Run strict IS OOS optimization
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/optimize_roc_cmo_is_oos.py
      - uses: actions/upload-artifact@v4
        with:
          name: roc-cmo-is-oos-results
          path: roc_cmo_is_oos_results.csv
