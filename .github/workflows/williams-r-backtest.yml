name: Williams R Tradier Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/williams_r_backtest.py'
      - 'scripts/williams_r_next_close_10y.py'
      - 'scripts/williams_r_benchmark.py'
      - 'scripts/williams_r_core_overlay.py'
      - 'scripts/williams_r_multi_etf_10y.py'
      - 'scripts/williams_r_extended_hours_recent.py'
      - 'scripts/williams_r_same_close_spy_spmo.py'
      - '.github/workflows/williams-r-backtest.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Run Tradier Williams %R replication
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/williams_r_backtest.py
      - name: Run 10-year next-close IS validation OOS backtest
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/williams_r_next_close_10y.py
      - name: Run exact-period SPY buy-and-hold benchmark
        run: python scripts/williams_r_benchmark.py
      - name: Run SPY core plus Williams R tactical overlay
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/williams_r_core_overlay.py
      - name: Run multi-ETF Williams R backtest
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/williams_r_multi_etf_10y.py
      - name: Run recent post-market execution test
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/williams_r_extended_hours_recent.py
      - name: Run SPY and SPMO same-close versus holding backtest
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/williams_r_same_close_spy_spmo.py
      - name: Commit backtest results
        run: |
          git config user.name "option-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/williams_r
          git commit -m "Refresh Williams R Tradier backtest results" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
