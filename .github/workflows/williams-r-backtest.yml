name: Williams R Tradier Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/williams_r_backtest.py'
      - '.github/workflows/williams-r-backtest.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Run Tradier Williams %R replication
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/williams_r_backtest.py
      - name: Commit backtest results
        run: |
          git config user.name "option-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/williams_r
          git commit -m "Refresh Williams R Tradier backtest results" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
