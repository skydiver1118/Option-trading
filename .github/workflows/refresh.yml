name: Refresh option dashboard
# Manual refresh trigger requested 2026-08-17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh.yml'
      - 'scripts/update_dashboard.py'
  schedule:
    # Primary EDT/EST schedules for 10:30, 13:00, 14:30 ET.
    - cron: '30 14 * * 1-5'
    - cron: '30 15 * * 1-5'
    - cron: '0 17 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '30 18 * * 1-5'
    - cron: '30 19 * * 1-5'
    # 15-minute fallback schedules. They protect against skipped/delayed GitHub cron runs.
    - cron: '45 14 * * 1-5'
    - cron: '45 15 * * 1-5'
    - cron: '15 17 * * 1-5'
    - cron: '15 18 * * 1-5'
    - cron: '45 18 * * 1-5'
    - cron: '45 19 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: option-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update dashboard data
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/update_dashboard.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet data/dashboard.json; then
            echo "No dashboard data change."
          else
            git config user.name "option-dashboard-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dashboard.json
            git commit -m "Refresh option dashboard data"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy dashboard to GitHub Pages
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - name: Retry GitHub Pages deployment
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
