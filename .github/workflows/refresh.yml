# Option dashboard refresh — self-healing scheduler
name: Refresh option dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh.yml'
      - 'scripts/update_dashboard.py'
      - 'scripts/update_dashboard_dynamic.py'
      - 'scripts/mrvl_calendar_snapshot.py'
      - 'tests/test_update_dashboard.py'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
  schedule:
    # Best-effort watchdog for the required 10:00, 12:00, 14:00 ET targets.
    # UTC window covers both EDT and EST.
    - cron: '7,22,37,52 13-20 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: option-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # This is a data-refresh job, not a historical-commit build. A queued
          # run must include data already committed by the preceding refresh.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Validate code
        run: |
          python -m py_compile scripts/update_dashboard.py scripts/update_dashboard_dynamic.py
          python -m unittest tests/test_update_dashboard.py
          node --check app.js
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from update_dashboard_dynamic import format_put_contract
          for strike, label in [(42.5, '42.5'), (45, '45'), (39.25, '39.25')]:
              assert format_put_contract('2030-01-18', strike) == f'2030-01-18 ${label}P'
          print('Python fractional-strike checks passed.')
          PY
          node - <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          // No network or DOM is needed to test the candidate renderer.
          const context = {fetch: () => new Promise(() => {}), assert};
          vm.runInNewContext(fs.readFileSync('app.js', 'utf8') + `
            assert.equal(strikeFmt(42.5), '$42.5P');
            assert.equal(strikeFmt(45), '$45P');
            assert.equal(strikeFmt(39.25), '$39.25P');
            const html = candidateTable({candidates: [{profile: 'Preferred', strike: 42.5}]});
            assert.ok(html.includes('<td>$42.5P</td>'));
          `, context);
          console.log('JavaScript fractional-strike checks passed.');
          JS

      - name: Decide whether a target refresh is missing
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import pandas_market_calendars as mcal

          et = ZoneInfo('America/New_York')
          now = datetime.now(et)
          event = os.getenv('EVENT_NAME','')
          trading = not mcal.get_calendar('NYSE').schedule(start_date=now.date(), end_date=now.date()).empty
          run = event in ('workflow_dispatch','push')
          reason = event
          target = None

          if event == 'schedule' and trading:
              targets = [now.replace(hour=h, minute=0, second=0, microsecond=0) for h in (10,12,14)]
              passed = [t for t in targets if now >= t]
              if passed:
                  target = max(passed)
                  try:
                      d = json.load(open('data/dashboard.json'))
                      stamp = datetime.strptime(d['updated_et'], '%Y-%m-%d %I:%M %p ET').replace(tzinfo=et)
                  except Exception:
                      stamp = datetime.min.replace(tzinfo=et)
                  run = stamp < target
                  reason = f'target={target:%H:%M} latest={stamp:%Y-%m-%d %H:%M}'
              else:
                  reason = 'before first 10:00 ET target'
          elif event == 'schedule' and not trading:
              reason = 'NYSE closed'

          print(f'run={str(run).lower()}')
          print(f'reason={reason}')
          print(f'now_et={now:%Y-%m-%d %H:%M:%S %Z}')
          PY

      - name: Show scheduling decision
        run: |
          echo "run=${{ steps.gate.outputs.run }}"
          echo "reason=${{ steps.gate.outputs.reason }}"
          echo "now_et=${{ steps.gate.outputs.now_et }}"

      - name: Update dashboard data — Greek-aware monthly expiration
        if: steps.gate.outputs.run == 'true'
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import update_dashboard_dynamic as d
          # Workflow is the single scheduling authority; never re-gate inside Python.
          d.base.should_run = lambda now: True
          d.main()
          PY

      - name: Update MRVL calendar snapshot
        if: steps.gate.outputs.run == 'true'
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/mrvl_calendar_snapshot.py

      - name: Verify fresh dashboard and policy
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          sys.path.insert(0, 'scripts')
          import update_dashboard as base
          from update_dashboard_dynamic import format_put_contract
          d=json.load(open('data/dashboard.json'))
          now=datetime.now(ZoneInfo('America/New_York'))
          stamp=datetime.strptime(d['updated_et'],'%Y-%m-%d %I:%M %p ET').replace(tzinfo=ZoneInfo('America/New_York'))
          age=(now-stamp).total_seconds()/60
          if age > 20: raise SystemExit(f'STALE dashboard generated: age={age:.1f} min')
          if d.get('option_data_source') != 'Tradier real-time': raise SystemExit(f'Unexpected option source: {d.get("option_data_source")}')
          if {x['ticker'] for x in d.get('tickers', [])} != set(base.TICKERS): raise SystemExit('Price universe is incomplete or outdated')
          for section in ('analysis', 'ranking'):
              if {x['ticker'] for x in d.get(section, [])} != set(base.PUT_NAMES): raise SystemExit(f'{section} universe is incomplete or outdated')
          bad=[x['ticker'] for x in d.get('analysis',[]) if x.get('decision')=='SELL' and x.get('long_term_rating') not in {'BUY','STRONG BUY'}]
          if bad: raise SystemExit(f'INVALID SELL without long-term BUY gate: {bad}')
          for x in d.get('analysis',[]):
              meta=x.get('expiration_selection') or {}
              dte=meta.get('dte')
              if dte is not None and not 19 <= int(dte) <= 50: raise SystemExit(f'{x["ticker"]} DTE outside 19-50: {dte}')
              cands=x.get('candidates') or []
              pref=next((c for c in cands if c.get('profile')=='Preferred'), cands[0] if cands else None)
              if pref and meta.get('expiration'):
                  expected=format_put_contract(meta['expiration'], pref['strike'])
                  if x.get('contract') != expected: raise SystemExit(f'{x["ticker"]}: incorrect contract label')
          scores=[float(x.get('score') or 0) for x in d.get('ranking',[])]
          if scores != sorted(scores, reverse=True): raise SystemExit('Ranking is not sorted by option score descending')
          if 'Greek-weighted' not in d.get('expiration_policy',''): raise SystemExit('Greek-weighted expiration policy missing')
          print(f'Fresh dashboard validated: {d["updated_et"]}; age={age:.1f} min')
          PY

      - name: Configure GitHub Pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/configure-pages@v5
      - name: Upload dashboard to Pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy dashboard to GitHub Pages
        if: steps.gate.outputs.run == 'true'
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry GitHub Pages deployment
        id: deploy2
        if: steps.gate.outputs.run == 'true' && steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Commit refreshed data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "option-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/mrvl_calendar.json
          git commit -m "Refresh Greek-aware option dashboard data" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*10))
          done
          echo 'ERROR: dashboard generated/deployed but repository commit push failed.' >&2
          exit 1
