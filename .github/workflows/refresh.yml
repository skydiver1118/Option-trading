name: Refresh option dashboard

on:
  workflow_dispatch:
  schedule:
    # Run both EDT and EST UTC equivalents. Python selects the correct set for New York time
    # using the cron expression itself, so GitHub Actions queue delays do not suppress a refresh.
    - cron: '30 14 * * 1-5'
    - cron: '30 15 * * 1-5'
    - cron: '0 17 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '30 18 * * 1-5'
    - cron: '30 19 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: option-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update dashboard data
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/update_dashboard.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet data/dashboard.json; then
            echo "No dashboard data change."
          else
            git config user.name "option-dashboard-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dashboard.json
            git commit -m "Refresh option dashboard data"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
