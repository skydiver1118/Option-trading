# Greek-aware monthly expiration engine: standard monthly only, 19-50 DTE
name: Refresh option dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh.yml'
      - 'scripts/update_dashboard.py'
      - 'scripts/update_dashboard_dynamic.py'
      - 'scripts/mrvl_calendar_snapshot.py'
      - 'tests/test_update_dashboard.py'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
  schedule:
    - cron: '45 13 * * 1-5'
    - cron: '15 14 * * 1-5'
    - cron: '45 15 * * 1-5'
    - cron: '15 16 * * 1-5'
    - cron: '45 17 * * 1-5'
    - cron: '15 18 * * 1-5'
    - cron: '45 14 * * 1-5'
    - cron: '15 15 * * 1-5'
    - cron: '45 16 * * 1-5'
    - cron: '15 17 * * 1-5'
    - cron: '45 18 * * 1-5'
    - cron: '15 19 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: option-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate Python and ownership-gate tests
        run: |
          python -m py_compile scripts/update_dashboard.py scripts/update_dashboard_dynamic.py
          python -m unittest tests/test_update_dashboard.py
      - name: Validate intended ET schedule and NYSE trading day
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import pandas_market_calendars as mcal
          et=ZoneInfo('America/New_York'); now=datetime.now(et); event=os.getenv('EVENT_NAME',''); cron=os.getenv('EVENT_SCHEDULE','').strip()
          edt={'45 13 * * 1-5','15 14 * * 1-5','45 15 * * 1-5','15 16 * * 1-5','45 17 * * 1-5','15 18 * * 1-5'}
          est={'45 14 * * 1-5','15 15 * * 1-5','45 16 * * 1-5','15 17 * * 1-5','45 18 * * 1-5','15 19 * * 1-5'}
          manual=event in ('workflow_dispatch','push'); matching=cron in (edt if now.utcoffset().total_seconds()/3600==-4 else est)
          trading=not mcal.get_calendar('NYSE').schedule(start_date=now.date(),end_date=now.date()).empty
          print(f'run={str(manual or (event=="schedule" and matching and trading)).lower()}')
          PY
      - name: Update dashboard data — Greek-aware monthly expiration
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/update_dashboard_dynamic.py
      - name: Update MRVL calendar snapshot
        if: steps.gate.outputs.run == 'true'
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/mrvl_calendar_snapshot.py
      - name: Verify dashboard policy
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/dashboard.json'))
          bad=[x['ticker'] for x in d.get('analysis',[]) if x.get('decision')=='SELL' and x.get('long_term_rating') not in {'BUY','STRONG BUY'}]
          if bad: raise SystemExit(f'INVALID SELL without long-term BUY gate: {bad}')
          for x in d.get('analysis',[]):
              dte=(x.get('expiration_selection') or {}).get('dte')
              if dte is not None and not 19 <= int(dte) <= 50: raise SystemExit(f'{x["ticker"]} DTE outside 19-50: {dte}')
          scores=[float(x.get('score') or 0) for x in d.get('ranking',[])]
          if scores != sorted(scores, reverse=True): raise SystemExit('Ranking is not sorted by option score descending')
          if 'Greek-weighted' not in d.get('expiration_policy',''): raise SystemExit('Greek-weighted expiration policy missing')
          print('Dynamic expiration policy validated.')
          PY
      - name: Configure GitHub Pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/configure-pages@v5
      - name: Upload dashboard to Pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy dashboard to GitHub Pages
        if: steps.gate.outputs.run == 'true'
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry GitHub Pages deployment
        id: deploy2
        if: steps.gate.outputs.run == 'true' && steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Commit refreshed data
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          git config user.name "option-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/mrvl_calendar.json
          git commit -m "Refresh Greek-aware option dashboard data" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
