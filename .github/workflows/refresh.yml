name: Refresh option dashboard

on:
  workflow_dispatch:
  schedule:
    # Run both EDT and EST UTC equivalents; Python gate keeps only 10:30, 13:00, 14:30 ET on NYSE trading days.
    - cron: '30 14 * * 1-5'
    - cron: '30 15 * * 1-5'
    - cron: '0 17 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '30 18 * * 1-5'
    - cron: '30 19 * * 1-5'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update dashboard data
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/update_dashboard.py
      - name: Commit refreshed data
        run: |
          if git diff --quiet data/dashboard.json; then
            echo "No dashboard data change."
            exit 0
          fi
          git config user.name "option-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          git commit -m "Refresh option dashboard data"
          git push
