name: Refresh option dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh.yml'
  schedule:
    # Target refreshes: 10:00 AM, 12:00 PM, 2:00 PM ET.
    # Two attempts per target, avoiding top-of-hour congestion.
    # EDT (UTC-4): 9:45/10:15, 11:45/12:15, 1:45/2:15 ET
    - cron: '45 13 * * 1-5'
    - cron: '15 14 * * 1-5'
    - cron: '45 15 * * 1-5'
    - cron: '15 16 * * 1-5'
    - cron: '45 17 * * 1-5'
    - cron: '15 18 * * 1-5'
    # EST (UTC-5)
    - cron: '45 14 * * 1-5'
    - cron: '15 15 * * 1-5'
    - cron: '45 16 * * 1-5'
    - cron: '15 17 * * 1-5'
    - cron: '45 18 * * 1-5'
    - cron: '15 19 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

# Never cancel a delayed valid refresh just because another reliability attempt starts.
# Serialize runs instead; stale/duplicate runs are harmless because later data wins.
concurrency:
  group: option-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Validate intended ET schedule and NYSE trading day
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import pandas_market_calendars as mcal

          et = ZoneInfo('America/New_York')
          now = datetime.now(et)
          event = os.getenv('EVENT_NAME','')
          cron = os.getenv('EVENT_SCHEDULE','').strip()

          # Crucial reliability rule: decide from the cron that SHOULD have run,
          # not the actual delayed GitHub start time. A 2:15 ET job starting at
          # 3:20 ET must still refresh rather than being discarded as "too late".
          edt_crons = {
            '45 13 * * 1-5','15 14 * * 1-5',
            '45 15 * * 1-5','15 16 * * 1-5',
            '45 17 * * 1-5','15 18 * * 1-5'
          }
          est_crons = {
            '45 14 * * 1-5','15 15 * * 1-5',
            '45 16 * * 1-5','15 17 * * 1-5',
            '45 18 * * 1-5','15 19 * * 1-5'
          }

          manual_or_fix_push = event in ('workflow_dispatch','push')
          utc_offset = now.utcoffset().total_seconds()/3600
          matching_cron = cron in (edt_crons if utc_offset == -4 else est_crons)

          # If a scheduled job is delayed across midnight, validate the intended
          # ET date inferred from the scheduled UTC time, not just actual start date.
          # For normal same-day delays, now.date() is correct.
          check_date = now.date()
          sched = mcal.get_calendar('NYSE').schedule(start_date=check_date, end_date=check_date)
          trading_day = not sched.empty

          run = manual_or_fix_push or (event == 'schedule' and matching_cron and trading_day)
          print(f'run={str(run).lower()}')
          print(f'now_et={now.strftime("%Y-%m-%d %I:%M %p ET")}')
          print(f'event_schedule={cron}')
          print(f'matching_cron={str(matching_cron).lower()}')
          print(f'trading_day={str(trading_day).lower()}')
          PY

      - name: Show refresh gate
        run: |
          echo "ET=${{ steps.gate.outputs.now_et }}"
          echo "cron=${{ steps.gate.outputs.event_schedule }} matching=${{ steps.gate.outputs.matching_cron }}"
          echo "run=${{ steps.gate.outputs.run }} trading_day=${{ steps.gate.outputs.trading_day }}"

      - name: Update dashboard data
        if: steps.gate.outputs.run == 'true'
        env:
          # Workflow gate has already validated the run, so force script manual path.
          GITHUB_EVENT_NAME: workflow_dispatch
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/update_dashboard.py

      - name: Verify dashboard was actually regenerated
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          p=Path('data/dashboard.json')
          if not p.exists():
              sys.exit('dashboard.json missing after refresh')
          d=json.loads(p.read_text())
          print('dashboard updated_et:', d.get('updated_et'))
          print('option source:', d.get('option_data_source'))
          if not d.get('updated_et'):
              sys.exit('dashboard.json has no updated_et')
          PY

      - name: Configure GitHub Pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/configure-pages@v5
      - name: Upload dashboard to Pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy dashboard to GitHub Pages
        if: steps.gate.outputs.run == 'true'
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before second deployment attempt
        if: steps.gate.outputs.run == 'true' && steps.deploy1.outcome == 'failure'
        run: sleep 30
      - name: Retry GitHub Pages deployment
        id: deploy2
        if: steps.gate.outputs.run == 'true' && steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before third deployment attempt
        if: steps.gate.outputs.run == 'true' && steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60
      - name: Final GitHub Pages deployment attempt
        id: deploy3
        if: steps.gate.outputs.run == 'true' && steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Best-effort commit refreshed data
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          if git diff --quiet data/dashboard.json; then
            echo "No dashboard data change."
          else
            git config user.name "option-dashboard-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dashboard.json
            git commit -m "Refresh option dashboard data" || true
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi

      - name: Report deployment result
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ "${{ steps.deploy1.outcome }}" = "success" ] || [ "${{ steps.deploy2.outcome }}" = "success" ] || [ "${{ steps.deploy3.outcome }}" = "success" ]; then
            echo "Dashboard deployed successfully."
          else
            echo "GitHub Pages deployment failed after three attempts; next scheduled run will retry."
          fi
