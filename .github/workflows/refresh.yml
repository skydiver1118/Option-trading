name: Refresh option dashboard

on:
  workflow_dispatch:
  schedule:
    # Morning reliability window around the requested 10:30 ET refresh.
    - cron: '20 14 * * 1-5'
    - cron: '30 14 * * 1-5'
    - cron: '40 14 * * 1-5'
    - cron: '20 15 * * 1-5'
    - cron: '30 15 * * 1-5'
    - cron: '40 15 * * 1-5'
    # 13:00 and 14:30 ET primary + fallback schedules.
    - cron: '0 17 * * 1-5'
    - cron: '15 17 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '15 18 * * 1-5'
    - cron: '30 18 * * 1-5'
    - cron: '45 18 * * 1-5'
    - cron: '30 19 * * 1-5'
    - cron: '45 19 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: option-dashboard-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update dashboard data
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/update_dashboard.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy dashboard to GitHub Pages
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before second deployment attempt
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - name: Retry GitHub Pages deployment
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before third deployment attempt
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60
      - name: Final GitHub Pages deployment attempt
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # Preserve the latest JSON in the repository, but never let a transient git race
      # turn an otherwise successful dashboard refresh into a failed workflow/email.
      - name: Best-effort commit refreshed data
        continue-on-error: true
        run: |
          if git diff --quiet data/dashboard.json; then
            echo "No dashboard data change."
          else
            git config user.name "option-dashboard-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dashboard.json
            git commit -m "Refresh option dashboard data" || true
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi

      - name: Report deployment result
        run: |
          if [ "${{ steps.deploy1.outcome }}" = "success" ] || [ "${{ steps.deploy2.outcome }}" = "success" ] || [ "${{ steps.deploy3.outcome }}" = "success" ]; then
            echo "Dashboard deployed successfully."
          else
            echo "GitHub Pages deployment failed after three attempts; a later scheduled fallback will retry."
          fi
