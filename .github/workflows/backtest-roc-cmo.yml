name: Backtest ROC CMO Mean Reversion
on:
  workflow_dispatch:
  push:
    paths: ['scripts/backtest_roc_cmo_mean_reversion.py','.github/workflows/backtest-roc-cmo.yml']
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy
      - name: Run comparison
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/backtest_roc_cmo_mean_reversion.py
      - uses: actions/upload-artifact@v4
        with:
          name: roc-cmo-results
          path: roc_cmo_comparison.csv
