name: SOXL WR CCI Fast
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/williams_r_soxl_wr_cci_fast_optimize.py'
      - '.github/workflows/soxl-wr-cci-fast.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Run fast SOXL WR CCI optimization
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/williams_r_soxl_wr_cci_fast_optimize.py
      - name: Commit results
        run: |
          git config user.name "option-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/williams_r
          git commit -m "Refresh SOXL WR CCI fast results" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
# triggered for focused optimization
