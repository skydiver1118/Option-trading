name: Optimize TQQQ Daily Strict IS
on:
  workflow_dispatch:
  push:
    paths: ['scripts/optimize_tqqq_daily_strict_is.py']
jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy requests
      - name: Optimize strictly on IS then reveal holdouts
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/optimize_tqqq_daily_strict_is.py
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/williams_r/tqqq_daily_strict_is_optimization.json
          git diff --cached --quiet || git commit -m 'Update strict TQQQ IS optimization'
          git push
