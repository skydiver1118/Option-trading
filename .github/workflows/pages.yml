name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Greek-aware expiration dashboard
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/dashboard.json'))
          scores=[float(x.get('score') or 0) for x in d.get('ranking',[])]
          if scores != sorted(scores, reverse=True): raise SystemExit('Ranking is not option-score descending')
          bad=[]
          for x in d.get('analysis',[]):
              m=x.get('expiration_selection') or {}
              dte=m.get('dte')
              if dte is not None and not 19 <= int(dte) <= 50: bad.append((x.get('ticker'),dte))
          if bad: raise SystemExit(f'Expiration outside 19-50 DTE: {bad}')
          if 'Greek-weighted' not in d.get('expiration_policy',''): raise SystemExit('Greek-aware expiration policy missing')
          print('Dynamic monthly expiration deployment gate passed.')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
