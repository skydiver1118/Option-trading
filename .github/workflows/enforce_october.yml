name: Enforce dynamic option dashboard

on:
  push:
    branches: [main]
    paths:
      - 'data/dashboard.json'

permissions:
  contents: write

concurrency:
  group: enforce-dynamic-dashboard
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check dynamic expiration policy
        id: check
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('data/dashboard.json'))
          scores=[float(x.get('score') or 0) for x in d.get('ranking',[])]
          dtes=[(x.get('expiration_selection') or {}).get('dte') for x in d.get('analysis',[])]
          ok=('Greek-weighted' in d.get('expiration_policy','') and scores==sorted(scores, reverse=True) and all(v is None or 19<=int(v)<=50 for v in dtes))
          print(f'correct={str(ok).lower()}')
          PY
      - name: Rebuild with Greek-aware monthly Tradier data
        if: steps.check.outputs.correct != 'true'
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/update_dashboard_dynamic.py
      - name: Commit corrected dashboard
        if: steps.check.outputs.correct != 'true'
        run: |
          git config user.name "option-dashboard-guardian"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          git commit -m "Correct dashboard to Greek-aware monthly expiration" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
