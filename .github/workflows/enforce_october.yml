name: Enforce October option dashboard

on:
  push:
    branches: [main]
    paths:
      - 'data/dashboard.json'

permissions:
  contents: write

concurrency:
  group: enforce-october-dashboard
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check expiration and ranking
        id: check
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('data/dashboard.json'))
          scores=[float(x.get('score') or 0) for x in d.get('ranking',[])]
          ok=(d.get('option_expiration')=='2026-10-16' and scores==sorted(scores, reverse=True))
          print(f'correct={str(ok).lower()}')
          print(f'expiration={d.get("option_expiration")}')
          PY
      - name: Rebuild with October monthly Tradier data
        if: steps.check.outputs.correct != 'true'
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/update_dashboard_october.py
      - name: Verify correction
        if: steps.check.outputs.correct != 'true'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/dashboard.json'))
          if d.get('option_expiration')!='2026-10-16': raise SystemExit('October correction failed')
          scores=[float(x.get('score') or 0) for x in d.get('ranking',[])]
          if scores != sorted(scores, reverse=True): raise SystemExit('Option-score ranking correction failed')
          print('October dashboard correction verified.')
          PY
      - name: Commit corrected dashboard
        if: steps.check.outputs.correct != 'true'
        run: |
          git config user.name "option-dashboard-guardian"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          git commit -m "Correct dashboard to October monthly expiration" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
