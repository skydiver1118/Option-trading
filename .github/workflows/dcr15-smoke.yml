name: DCR15 Tradier Smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/dcr15_tradier_bot.py'
      - 'scripts/start_dcr15_paper.ps1'
      - 'scripts/install_dcr15_paper_task.ps1'
      - 'tests/test_dcr15_execution_safety.py'
      - 'requirements-dcr15.txt'
      - '.github/workflows/dcr15-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dcr15.txt
      - name: Compile Python
        run: python -m py_compile scripts/dcr15_tradier_bot.py tests/test_dcr15_execution_safety.py
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content scripts/start_dcr15_paper.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content scripts/install_dcr15_paper_task.ps1 -Raw))
      - name: Execution safety tests
        run: python tests/test_dcr15_execution_safety.py
      # This dry-run uses production Tradier market data but cannot submit an order.
      - name: Real Tradier data dry-run
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          DCR15_MODE: dryrun
          DCR15_STATE_PATH: /tmp/dcr15-state.json
          DCR15_AUDIT_PATH: /tmp/dcr15-audit.csv
        run: python scripts/dcr15_tradier_bot.py --once
