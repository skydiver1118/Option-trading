name: SOXL Daily Third Indicator RVOL
on:
  push:
    paths:
      - 'scripts/soxl_daily_third_indicator_rvol.py'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run RVOL backtest
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/soxl_daily_third_indicator_rvol.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/williams_r/soxl_daily_rvol_is_buckets.csv data/williams_r/soxl_daily_third_indicator_rvol_best.csv data/williams_r/soxl_daily_third_indicator_rvol_grid.csv
          git commit -m 'Update SOXL RVOL backtest results' || exit 0
          git push
