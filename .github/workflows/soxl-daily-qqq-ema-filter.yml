name: SOXL Daily QQQ EMA Filter Compare
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/soxl_daily_qqq_ema_filter_compare.py'
      - '.github/workflows/soxl-daily-qqq-ema-filter.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Run comparison
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/soxl_daily_qqq_ema_filter_compare.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/williams_r/soxl_daily_WR2_CCI5_qqq_ema_filter_compare.csv
          git diff --cached --quiet || git commit -m 'Update SOXL QQQ EMA filter backtest'
          git push
