name: SOXL Daily QQQ EMA200 Sizing

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/soxl_daily_qqq_ema200_sizing.py

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run sizing comparison
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/soxl_daily_qqq_ema200_sizing.py

      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/williams_r/soxl_daily_qqq_ema200_sizing_compare.csv
          git commit -m "Update QQQ EMA200 sizing results" || exit 0
          git push
