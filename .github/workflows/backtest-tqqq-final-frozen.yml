name: Backtest TQQQ Final Frozen 10Y
on:
  workflow_dispatch:
  push:
    paths: ['scripts/backtest_tqqq_final_frozen_10y.py']
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy requests
      - env: {TRADIER_TOKEN: '${{ secrets.TRADIER_TOKEN }}'}
        run: python scripts/backtest_tqqq_final_frozen_10y.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/williams_r/tqqq_final_frozen_10y_*.json data/williams_r/tqqq_final_frozen_10y_*.csv
          git diff --cached --quiet || git commit -m 'Update final frozen TQQQ 10Y backtest'
          git push
