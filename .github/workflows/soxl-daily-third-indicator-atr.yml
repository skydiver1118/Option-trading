name: SOXL Daily Third Indicator ATR
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/soxl_daily_third_indicator_atr.py'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run ATR third-indicator test
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/soxl_daily_third_indicator_atr.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/williams_r/soxl_daily_third_indicator_atr_*.csv
          git commit -m 'Update SOXL ATR third-indicator results' || exit 0
          git push
