name: SOXL 15m Third Indicator Strict IS
on:
  workflow_dispatch:
  push:
    paths: ['scripts/soxl_15m_third_indicator_strict_is.py']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - name: Run strict IS-only 15m search
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/soxl_15m_third_indicator_strict_is.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/williams_r/soxl_15m_third_indicator_strict_IS_*.csv
          git commit -m 'Update SOXL 15m strict IS third-indicator results' || exit 0
          git push
