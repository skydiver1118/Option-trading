name: SOXL TCAR vs Buy Hold
on:
  workflow_dispatch:
  push:
    paths: ['scripts/soxl_tcmr_vs_buyhold.py']
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy requests
      - env: {TRADIER_TOKEN: '${{ secrets.TRADIER_TOKEN }}'}
        run: python scripts/soxl_tcmr_vs_buyhold.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/williams_r/soxl_tcar_vs_buyhold.csv
          git commit -m 'Update TCAR versus buy-hold metrics' || exit 0
          git push
