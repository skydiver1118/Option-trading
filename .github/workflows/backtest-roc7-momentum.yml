name: Backtest ROC7 Momentum
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/backtest_roc7_momentum.py'
      - '.github/workflows/backtest-roc7-momentum.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - name: Run ROC7 backtest
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
        run: python scripts/backtest_roc7_momentum.py
      - uses: actions/upload-artifact@v4
        with:
          name: roc7-results
          path: roc7_results.csv
