name: SOXL 15m 40d Optimization
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/soxl_15m_wr_cci_40d_opt.py'
      - '.github/workflows/soxl-15m-40d.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Optimize SOXL 15m on IS and test OOS
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python scripts/soxl_15m_wr_cci_40d_opt.py
      - name: Commit results
        run: |
          git config user.name "option-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/williams_r
          git commit -m "Refresh SOXL 15m 40d backtest" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
